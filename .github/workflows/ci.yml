# Q6: test -> (only if green) build unique-tagged image -> deploy to kind ->
# wait for rollout. If the test job fails, build-and-deploy NEVER STARTS:
# the existing Deployment keeps serving the previous version untouched.
# That structural property IS the Q6 answer ("keep the existing version
# running and stop the deployment") -- there is no rollback step because
# there is never a half-deploy to roll back.
#
# RUNNER IMAGE (review item (b)): locally this runs under act with the
# COMMUNITY image catthehacker/ubuntu:act-24.04, pinned via -P on the act
# command line (act's interactive picker fatals in non-tty shells). On real
# GitHub Actions the equivalent runner is ubuntu-latest. The PostgreSQL
# recipe below is a step, not jobs.<id>.services:, precisely so ONE recipe
# serves both backends: act never implemented services (issue #88), while a
# docker-run step works on hosted runners too. Job boundaries (test |
# build-and-deploy) are unchanged, so `needs: test` semantics stay real --
# the negative control runs this FULL workflow with no act -j flag.
#
# act constraints obeyed here (all measured, artifacts stage-q6-t0a/b):
#   - job containers run network=host -> 127.0.0.1 reaches Docker-published
#     ports of the Desktop VM (kind API 60535, the pg-ci publish below).
#     kubeconfig server needs NO rewrite; rewriting to host.docker.internal
#     FAILS x509 SAN validation (kind's cert names localhost/relay-control-
#     plane only -- measured, after a CERT_NONE probe had hidden it).
#   - $GITHUB_ENV propagation is NOT relied on (act support incomplete):
#     KUBECONFIG is a step-level env, and uv is invoked by explicit path.
#   - .act-stage/ (git-ignored, .dockerignored: holds a COPY of the kind
#     kubeconfig + Linux kind/kubectl) carries those into the workspace;
#     with act -b the workspace is this checkout itself. On GitHub the
#     binaries come from the hosted runner instead -- the -x guards below
#     cover both paths without pretending the second was executed here.
#     CARRIER NAMING: the kubeconfig copy is relay-kubeconfig (NO .yaml --
#     act YAML-SCANS the repo root as workflow candidates: .act-stage/
#     relay-kubeconfig.yaml made act validate a kubeconfig as a workflow and
#     die on 'Unknown Property apiVersion'; compose.test.yaml tripped the
#     same scan. GitHub only reads .github/workflows/, so both are act-only
#     hazards; every act run passes --workflows explicitly as the durable
#     guard, the rename removes the mine that was in our own tree.)
#   - .act-stage/ carrier is GONE from the deploy path: run #1 on real GitHub
#     Actions proved why -- .act-stage is git-ignored, so a hosted runner's
#     checkout has no such directory and the install died (the '--x guards
#     cover both paths' claim in the first revision was overreach: a branch
#     that never executed on GH cannot claim coverage). THE ONE RECIPE NOW:
#     deploy always downloads checksum-pinned kind/kubectl (aee61515.../8efbb943...
#     -- the same sums recorded in t0a, the local carrier re-verified against
#     them before pinning), then finds-or-creates the 'relay' cluster: act
#     exports the existing cluster's kubeconfig (network=host reaches the
#     published 127.0.0.1 port); a hosted runner creates an EPHEMERAL kind
#     cluster from the SAME pinned node image (kindest/node:v1.34.11@sha256:
#     44e222ee...) and applies k8s/ manifests (app.yaml rendered to the
#     VERSION tag; image loaded BEFORE apply so IfNotPresent never pulls a
#     local-only name). No branch relies on files that exist on only one backend.
name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # ONE venv location for every step of the test job. Under act -b the
  # workspace IS the host checkout, so a default .venv would be written into
  # the host's working tree (and clash with any .venv the host put there).
  UV_PROJECT_ENVIRONMENT: /tmp/relay-venv
  # Reviewer-mandated: pre-empt the Node.js runner migration. checkout@v5
  # declares node24 already (v4.2.0 STILL declares node20 -- measured against
  # action.yml, which is why the bump is v5, not v4.2.0); the flag covers any
  # remaining node20-era JS actions on runners that honour it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (pinned) and project deps (locked)
        # Pin = the version measured INSIDE the delivered image (uv 0.12.15,
        # `docker run --rm agent-relay:v2 uv --version`), NOT an assumption:
        # the Dockerfile installs uv floating, so CI pins the observable
        # provenance; it also reads uv.lock revision 3. The --version grep
        # makes the pin self-checking: if the installer ever serves a
        # different build, the step fails HERE instead of silently drifting.
        # Installer (astral's documented mechanism) writes to ~/.local/bin --
        # act images' system pip may be PEP-668 externally-managed and refuse
        # `pip install uv`, the installer works regardless. uv is then called
        # by explicit path: PATH games across act steps are not trusted.
        # uv.lock is NEVER rewritten: --locked is the STRICTER of the pair --
        # it verifies the lock matches pyproject and fails on drift, then
        # installs exactly from it, dev group included (the Stage C/D recipes
        # this step feeds need pytest). --frozen --locked were tried first:
        # uv rejects the combination ('--frozen cannot be used with --locked')
        # and --frozen alone would SKIP the drift verification, so --locked
        # alone is both valid and the stronger guarantee of the two.
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | env UV_UNMANAGED_INSTALL="$HOME/.local/bin" sh
          "$HOME/.local/bin/uv" --version | grep -q "${UV_VERSION}"
          "$HOME/.local/bin/uv" sync --locked
        env:
          UV_VERSION: 0.12.15

      - name: Starter tests (default SQLite backend)
        # No RELAY_* here ON PURPOSE: the default IS the tested behavior --
        # conftest defaults to a scratch SQLite file and the suite proves the
        # flow there. Pinning sqlite would duplicate Stage C's matrix instead
        # of exercising the shipped default.
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" run --no-sync python -m pytest test_agent_relay.py -q

      - name: Start PostgreSQL (the services:-free recipe that runs on act AND hosted runners)
        # Host port 5434, not 5432. Measured context (Stage A): host-side
        # 5432 is occupied by onlinejudgedeploy-oj-postgres-1 and 5433 is
        # relay-pg-q4's publish; under network=host the -p bind happens in
        # THAT namespace, so a free slot must be chosen against the real
        # namespace's occupancy. 5434 is the verified-free slot AS OF THIS
        # MEASUREMENT -- if it is ever taken, docker run fails fast with a
        # port-in-use error (visible, not silent); re-verify and bump.
        # DB name contains 'test' -> testsupport's safety gate accepts it
        # WITHOUT the RELAY_IT_ALLOW_DB=1 bypass.
        # pg_isready forces -h: socket-only checks can pass during the
        # initdb temp-server phase (Stage E lesson, applied twice now).
        # The loop EXITS 1 after 30s with PG logs -- a break-on-success-only
        # loop would let pytest run against a dead DB with fuzzy attribution.
        run: |
          set -euo pipefail
          docker rm -f pg-ci 2>/dev/null || true
          docker run -d --name pg-ci \
            -e POSTGRES_USER=agent \
            -e POSTGRES_PASSWORD=agent \
            -e POSTGRES_DB=agent_relay_test \
            -p 5434:5432 \
            postgres:16-alpine
          ok=0
          for i in $(seq 1 30); do
            if docker exec pg-ci pg_isready -h 127.0.0.1 -U agent -d agent_relay_test >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "postgres NOT ready in 30s -- logs:"; docker logs pg-ci 2>&1 | tail -20
            exit 1
          fi

      - name: Integration tests against PostgreSQL
        # Backend is PINNED, not hoped for: RELAY_EXPECT_BACKEND=postgresql
        # FAILS the run if the URL ever silently falls back to SQLite (the
        # Stage C guard, doing its job in CI). The whole directory runs --
        # '-k postgres' matched ZERO tests (verified before writing this;
        # it would have exited 5 or collected nothing while looking busy).
        # The SEEN DATABASE_URL line is the independent witness: what the
        # process resolved, printed outside pytest's header.
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent:agent@127.0.0.1:5434/agent_relay_test
          RELAY_EXPECT_BACKEND: postgresql
        run: |
          set -euo pipefail
          "$HOME/.local/bin/uv" run --no-sync python -c "import database; print('SEEN DATABASE_URL =', database.DATABASE_URL)"
          "$HOME/.local/bin/uv" run --no-sync python -m pytest tests/integration -q

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pg-ci

  # Repeated for grep-ability, since this file IS the Q6 answer:
  # needs: test above == "if a test fails, keep the existing version running
  # and stop the deployment". No build, no tag, no set image, no rollout.
  build-and-deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve unique tag from VERSION
        # The tag lives IN git, so every deployed version is traceable
        # every deployed version is traceable from the repo. Deliberately NOT
        # derived from git SHA: the Dockerfile's `COPY . .` means image
        # content shifts with ANY copied file, and a SHA-based tag would hide
        # exactly the "same SHA, different bytes" ambiguity the v1/v2 episode
        # exposed (the README.md edit changed copied content, not the commit).
        id: tag
        run: echo "tag=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "agent-relay:${{ steps.tag.outputs.tag }}" .

      - name: Show tag (also proves the GITHUB_OUTPUT pipe works in this act version)
        run: |
          echo "tag is [${{ steps.tag.outputs.tag }}]"
          test -n "${{ steps.tag.outputs.tag }}"

      - name: Provision pinned toolchain (kind + kubectl, checksum-verified)
        # WHY THIS EXISTS: GitHub run #1 died right here -- the first revision
        # installed kind/kubectl from .act-stage/, which is GIT-IGNORED, so a
        # hosted runner's checkout has no such directory (the '--x guards
        # cover both paths' line in that revision was an overreach: a branch
        # never executed on GitHub cannot claim coverage). Downloading with
        # published checksums works identically on act and hosted runners --
        # and the sums are the SAME ones the local carrier verified against
        # (stage-q6-t0a), carrier re-checked before pinning.
        # Installed under $HOME, invoked by EXPLICIT PATH: /usr/local/bin
        # writability differs between act (root) and hosted runners, and PATH
        # / $GITHUB_ENV propagation across act steps is not trusted. $HOME
        # survives across steps of one job on both backends.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/relay-ci"
          curl -fsSL -o "$HOME/relay-ci/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $HOME/relay-ci/kind" | sha256sum -c -
          curl -fsSL -o "$HOME/relay-ci/kubectl" https://dl.k8s.io/release/v1.34.11/bin/linux/amd64/kubectl
          echo "8efbb9435132a190920eb65a47a8c1ecf755ad85ab57a600c9bedbab460bb7a8  $HOME/relay-ci/kubectl" | sha256sum -c -
          chmod +x "$HOME/relay-ci/kind" "$HOME/relay-ci/kubectl"
          "$HOME/relay-ci/kind" --version | head -1
          "$HOME/relay-ci/kubectl" version --client | head -1

      - name: Find-or-create the kind cluster, load the image, deploy
        # ONE recipe, two backends, branch PRINTED into the log:
        #   existing cluster named 'relay' (the local act path -- Desktop VM,
        #     network=host reaches its published 127.0.0.1:60535; T0 probe 4
        #     measured that kind sees this cluster through the socket)
        #     -> load, set image, rollout. THIS path is what run #1 reached
        #     locally; it stayed green through the T1/T2/T3 episodes.
        #   no 'relay' cluster (GitHub hosted runner) -> create one EPHEMERALLY
        #     from the SAME digest-pinned node image kind v0.33.0 shipped for
        #     v1.34.11 (never :latest), apply k8s/ manifests with the image
        #     rendered to the VERSION tag, load the image BEFORE the app apply
        #     so IfNotPresent never has to pull a local-only name.
        #     HONESTY FLAG: this ephemeral branch is NEW CODE as of this
        #     commit -- run #1 died before any cluster logic, so nothing here
        #     had ever executed on GitHub until this push's run says so.
        # --kubeconfig FLAGS everywhere on kubectl, not the env var: step-level
        #   env propagation in act has already been distrusted by design.
        #   kind is the EXCEPTION because it MUSTN'T take one: `kind load
        #   docker-image --kubeconfig` is 'unknown flag' (v0.33.0 --help has no
        #   such flag; act run proved it, and the T0-era 'kind delete takes
        #   --kubeconfig' memory was about a DIFFERENT subcommand). kind reads
        #   $KUBECONFIG, so the export below is load-bearing for kind and the
        #   flags for kubectl -- both spellings, each where it actually works.
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          KIND="$HOME/relay-ci/kind"; KCTL="$HOME/relay-ci/kubectl"; KC="$HOME/relay-ci/kubeconfig"
          export KUBECONFIG="$KC"
          $KIND get clusters || true
          if $KIND get clusters 2>/dev/null | grep -qx relay; then
            echo "BACKEND=existing-cluster (act against the Desktop VM's relay)"
            $KIND get kubeconfig --name relay > "$KC"
            $KIND load docker-image "agent-relay:$TAG" --name relay
            docker exec relay-control-plane crictl images | grep -E "agent-relay.*$TAG"   # anti-silent-skip
            "$KCTL" --kubeconfig "$KC" set image deployment/agent-relay "agent-relay=agent-relay:$TAG"
            "$KCTL" --kubeconfig "$KC" rollout status deployment/agent-relay --timeout=180s
          else
            echo "BACKEND=ephemeral-cluster (hosted runner: nothing to keep; the Q6 keep-the-old-version gate still lives in needs:)"
            $KIND create cluster --name relay --image kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d --kubeconfig "$KC" --wait 120s
            $KIND load docker-image "agent-relay:$TAG" --name relay
            docker exec relay-control-plane crictl images | grep -E "agent-relay.*$TAG"
            "$KCTL" --kubeconfig "$KC" apply -f k8s/postgres.yaml
            "$KCTL" --kubeconfig "$KC" rollout status deployment/postgres --timeout=300s
            sed -E "s|image: agent-relay:v[0-9]+|image: agent-relay:$TAG|" k8s/app.yaml > "$HOME/relay-ci/app.rendered.yaml"
            grep "image: agent-relay:" "$HOME/relay-ci/app.rendered.yaml"
            "$KCTL" --kubeconfig "$KC" apply -f "$HOME/relay-ci/app.rendered.yaml"
            "$KCTL" --kubeconfig "$KC" rollout status deployment/agent-relay --timeout=300s
          fi
        # NOTE on tag uniqueness: VERSION-in-git keeps tags unique per VERSION,
        # but identical tags across runs are only identical IMAGES while the
        # base layers (python:3.12-slim etc.) hold still -- upstream base drift
        # makes same-tag-different-bytes possible over time. Accepted for this
        # assignment (the v1/v2 lesson was about LOCAL staleness, which the
        # crictl witness above covers); pinning base digests is the production
        # fix, noted rather than quietly skipped.

      - name: Verify deployment at CONTENT level, not just tag
        # 'rollout finished' + template carries the tag is still label-level.
        # Two content witnesses: (1) the RUNNING pod serves the new heading,
        # fetched from INSIDE the pod (no port-forward dependency in CI);
        # (2) /ready answers 200 from the same pod. -i because the program
        # arrives on stdin (host-side shell quoting has burned this workflow
        # repeatedly; stdin transfer is the standing convention).
        run: |
          set -euo pipefail
          KC="$HOME/relay-ci/kubeconfig"; KCTL="$HOME/relay-ci/kubectl"
          "$KCTL" --kubeconfig "$KC" get deployment agent-relay -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' | grep "agent-relay:${{ steps.tag.outputs.tag }}"
          "$KCTL" --kubeconfig "$KC" exec -i deploy/agent-relay -c agent-relay -- python - <<'PY'
          import urllib.request
          body = urllib.request.urlopen("http://127.0.0.1:8000/", timeout=10).read().decode()
          assert "<h1>Agent Relay v2</h1>" in body, "new heading NOT serving from the pod"
          assert urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=10).status == 200
          print("pod serves '<h1>Agent Relay v2</h1>'; /ready 200")
          PY

  # If the test job fails, NOTHING in this file past `needs: test` executes:
  # no image is built, no tag minted, no set image issued. The cluster keeps
  # the previous version's pods running -- Q6 answer B as structure.
